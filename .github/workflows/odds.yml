name: Refresh DraftKings Odds

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    paths:
      - 'scripts/update_odds.py'
      - '.github/workflows/odds.yml'

permissions:
  contents: write

concurrency:
  group: draftkings-odds-refresh
  cancel-in-progress: true

jobs:
  refresh-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install DraftKings fetch dependency
        run: python -m pip install --disable-pip-version-check curl_cffi

      - name: Refresh DraftKings odds
        run: python scripts/update_odds.py

      - name: Validate live DraftKings markets
        run: |
          python - <<'PY'
          import json
          with open('data/sports-data.json', encoding='utf-8') as f:
              d=json.load(f)
          dk=d.get('draftkingsOdds',{})
          games=dk.get('games',[])
          print('DraftKings games parsed:', len(games))
          print('By sport:', {s:sum(1 for g in games if g.get('sport')==s) for s in ['cfb','nfl','mlb','epl','cvb']})
          print('Errors:', dk.get('errors',{}))
          if not games:
              raise SystemExit('No DraftKings markets parsed; refusing to publish an unavailable snapshot')
          PY

      - name: Validate updated JSON
        run: python -m json.tool data/sports-data.json >/dev/null

      - name: Commit changed odds snapshot
        run: |
          if git diff --quiet -- data/sports-data.json; then
            echo "No odds changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/sports-data.json
          git commit -m "Refresh DraftKings odds"
          git push
