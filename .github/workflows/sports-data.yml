name: Refresh Sports Data

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
  push:
    paths:
      - 'scripts/update_data.py'
      - '.github/workflows/sports-data.yml'

permissions:
  contents: write

concurrency:
  group: sports-data-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh schedules scores standings and rankings
        run: python scripts/update_data.py

      - name: Validate refreshed JSON
        run: python -m json.tool data/sports-data.json >/dev/null

      - name: Commit refreshed sports data
        run: |
          if git diff --quiet -- data/sports-data.json; then
            echo "No sports-data changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/sports-data.json
          git commit -m "Refresh sports data"
          git push
