name: Refresh Dayton Sports data

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_data.py'
      - 'scripts/diagnose_data.py'
      - '.github/workflows/update.yml'
      - 'data/sports-data.json'

permissions:
  contents: write

concurrency:
  group: dayton-sports-data-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax check updater
        run: python -m py_compile scripts/update_data.py scripts/diagnose_data.py

      - name: Diagnose ESPN feeds
        run: python scripts/diagnose_data.py

      - name: Refresh sports data
        run: python scripts/update_data.py

      - name: Validate generated JSON
        run: |
          python -m json.tool data/sports-data.json >/dev/null
          python -m json.tool data/diagnostics.json >/dev/null

      - name: Commit refreshed data if changed
        run: |
          if git diff --quiet -- data/sports-data.json data/diagnostics.json; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "dayton-sports-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sports-data.json data/diagnostics.json
          git commit -m "Auto-update sports data"
          git push origin HEAD:${{ github.ref_name }}
