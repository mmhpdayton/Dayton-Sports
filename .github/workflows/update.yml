name: Validate Dayton Sports

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'assets/**'
      - 'scripts/update_data.py'
      - 'scripts/update_odds.py'
      - 'data/sports-data.json'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'index.html'
      - 'assets/**'
      - 'scripts/update_data.py'
      - 'scripts/update_odds.py'
      - 'data/sports-data.json'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Python and JSON
        run: |
          python -m py_compile scripts/update_data.py scripts/update_odds.py
          python -m json.tool data/sports-data.json >/dev/null

      - name: Validate JavaScript
        run: |
          node --check assets/bootstrap.js
          node --check assets/app.js
          node --check assets/runtime.js
          node --check assets/cfb-accordion.js
          node --check assets/odds.js
          node --check assets/home-v3.js

      - name: Confirm required site files
        run: |
          test -s index.html
          test -s assets/styles.css
          test -s assets/app.js
          test -s assets/odds.js
          test -s data/sports-data.json
