name: Refresh Dayton Sports data

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update_data.py'
      - '.github/workflows/update.yml'

permissions:
  contents: write

concurrency:
  group: dayton-sports-data-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh Dayton Sports data
        run: python scripts/update_data.py

      - name: Commit refreshed data if changed
        run: |
          if git diff --quiet -- data/sports-data.json; then
            echo "No data changes."
            exit 0
          fi
          git config user.name "dayton-sports-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sports-data.json
          git commit -m "Auto-update sports data"
          git push
