name: Refresh Family Scores

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */12 * * *'
  push:
    paths:
      - 'scripts/refresh_family_scores.py'
      - '.github/workflows/family-scores.yml'

permissions:
  contents: write

concurrency:
  group: family-score-refresh
  cancel-in-progress: true

jobs:
  refresh-family-scores:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh family team scores
        run: python scripts/refresh_family_scores.py

      - name: Validate JSON
        run: python -m json.tool data/sports-data.json >/dev/null

      - name: Commit family score changes
        run: |
          if git diff --quiet -- data/sports-data.json; then
            echo "No family score changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/sports-data.json
          git commit -m "Refresh family team scores"
          git push
